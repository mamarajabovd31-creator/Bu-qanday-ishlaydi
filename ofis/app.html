<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Virtual Ofis</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Telefon uchun: tepada 3D ofis, pastda chat/vazifalar/jamoa varag'i. Bitta tungi ko'rinish. */
:root{
  --bg:#0b0f1a; --panel:#10162a; --card:#161f36; --card2:#1c2742; --line:#25314d;
  --text:#eef1f8; --muted:#8994b0; --dim:#5d6886;
  --accent:#ffb547; --accent-ink:#2a1900; --mint:#3fd8a6; --red:#ff6b6b; --violet:#a98bff; --sky:#5fb4ff;
  --f-display:"Unbounded",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --vh:var(--tg-viewport-stable-height,100vh);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:var(--vh);display:grid;grid-template-rows:minmax(220px,43%) minmax(0,1fr)}
@media (min-width:900px){.app{grid-template-rows:none;grid-template-columns:minmax(0,1fr) 420px;height:100vh}}

/* ---- 3D sahna ---- */
.stage{position:relative;overflow:hidden;background:#090d1c;min-height:0}
#c{display:block;width:100%;height:100%;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;font:700 10.5px/1 var(--f-body);padding:4px 7px 4px 5px;border-radius:999px;background:rgba(9,13,28,.82);border:1px solid rgba(255,255,255,.09);white-space:nowrap;will-change:transform;transition:opacity .25s}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.tag.work i{background:var(--accent);box-shadow:0 0 0 3px rgba(255,181,71,.2)}
.tag.walk i{background:var(--sky)}
.tag.think i{background:var(--violet);animation:pulse 1s infinite}
.tag.err i{background:var(--red)}
.tag em{font:600 10px var(--f-mono);font-style:normal;color:var(--accent)}
.tag.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag.sel em{color:var(--accent-ink)}
@keyframes pulse{50%{opacity:.35}}
.bub{position:absolute;left:0;top:0;max-width:170px;font:700 11.5px/1.35 var(--f-body);padding:7px 10px;border-radius:12px 12px 12px 3px;background:#fff;color:#141a2a;box-shadow:0 8px 20px rgba(0,0,0,.35);will-change:transform}
.bub.dots::after{content:"";display:inline-block;width:18px;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:8px;background:rgba(9,13,28,.78);border:1px solid var(--line);border-radius:12px;padding:7px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand b{font:600 12px var(--f-display);letter-spacing:.01em}
.brand small{font:600 10px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.led{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(63,216,166,.18)}
.led.demo{background:var(--accent);box-shadow:0 0 0 3px rgba(255,181,71,.18)}
.led.off{background:var(--red)}
#activeN{font:600 11px var(--f-body);color:var(--muted)}
#activeN b{font-family:var(--f-mono);color:var(--accent)}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:calc(100% - 24px);background:rgba(9,13,28,.9);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:600;backdrop-filter:blur(10px);pointer-events:none;transition:opacity .3s}

/* ---- Varaq ---- */
.sheet{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;margin-top:-14px;position:relative;z-index:2;box-shadow:0 -10px 30px rgba(0,0,0,.35)}
@media (min-width:900px){.sheet{margin-top:0;border-radius:0;border-top:0;border-left:1px solid var(--line)}}
.grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:8px auto 2px}
.tabs{display:flex;gap:4px;padding:6px 14px 10px}
.tab{flex:1;padding:8px 6px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-selected="true"]{background:var(--card);color:var(--text)}
.cnt{font:600 10px var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 6px}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px max(14px,env(safe-area-inset-left,0px)) 14px max(14px,env(safe-area-inset-right,0px))}
.banner{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.3);font-size:12.5px;color:#ffd99a}

/* chat */
.msgs{display:flex;flex-direction:column;gap:12px}
.m{display:flex;gap:9px;align-items:flex-start}
.av{width:32px;height:32px;flex:none;border-radius:11px;display:grid;place-items:center;font:600 12px var(--f-display);color:#fff;position:relative}
.m .b{min-width:0;flex:1}
.m .meta{display:flex;align-items:baseline;gap:6px;margin-bottom:3px;font-size:11px;color:var(--muted)}
.m .meta b{font-size:13px;color:var(--text)}
.m .meta .t{margin-left:auto;font:500 10px var(--f-mono);color:var(--dim)}
.m .txt{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 11px;font-size:14px;overflow-wrap:anywhere}
.m .txt p{margin:0 0 6px}.m .txt p:last-child{margin:0}
.mention{color:var(--accent);font-weight:700}
.me{justify-content:flex-end}
.me .txt{background:#2b2418;border-color:#4d3a1d;border-radius:14px 4px 14px 14px;max-width:84%}
.me.wait{opacity:.6}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:7px}
.tchip{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 9px;text-align:left;width:100%}
.tchip .av{width:22px;height:22px;border-radius:7px;font-size:10px}
.tchip .tt{min-width:0;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tchip .tt small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.tchip .pc{font:600 11px var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums}
.tchip .pc.ok{color:var(--mint)} .tchip .pc.err{color:var(--red)}
.bar{grid-column:1/-1;height:4px;border-radius:9px;background:#212c47;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:width .5s}
.bar.ok i{background:var(--mint)}
.res{margin-top:7px;border-radius:12px;border:1px solid rgba(63,216,166,.35);background:linear-gradient(180deg,rgba(63,216,166,.08),rgba(63,216,166,.02));padding:10px 11px}
.res .rt{font:600 9.5px var(--f-display);letter-spacing:.14em;color:var(--mint);text-transform:uppercase}
.res .rh{font-weight:800;font-size:14px;margin:3px 0 4px}
.res .rp{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.res .open{margin-top:8px;background:var(--mint);color:#062a1d;font-weight:800;font-size:13px;border-radius:9px;padding:7px 12px}
.typing{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--muted)}
.typing .av{width:24px;height:24px;border-radius:8px;font-size:10px}
.compose{border-top:1px solid var(--line);padding:8px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));position:relative;background:var(--panel)}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.quick::-webkit-scrollbar{display:none}
.qc{flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;color:var(--muted)}
.row{display:flex;gap:8px;align-items:flex-end}
#inp{flex:1;min-width:0;resize:none;max-height:110px;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:10px 12px;font:500 16px/1.35 var(--f-body)}
#inp::placeholder{color:var(--dim)}
.send{width:44px;height:44px;flex:none;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.send:disabled{opacity:.45}
.mlist{position:absolute;left:12px;right:12px;bottom:calc(100% - 4px);background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:5px;max-height:230px;overflow-y:auto;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.mlist button{display:flex;width:100%;align-items:center;gap:10px;border-radius:9px;padding:6px 8px;text-align:left}
.mlist button.on,.mlist button:hover{background:#26324f}
.mlist .av{width:26px;height:26px;border-radius:8px;font-size:10px}
.mlist small{color:var(--muted);font-size:11px}

/* vazifalar */
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.tl{display:flex;flex-direction:column;gap:9px}
.task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 11px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center}
.task .tt{min-width:0;font-weight:800;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.task .tt small{display:block;font-weight:600;font-size:11.5px;color:var(--muted);margin-top:2px}
.st{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.st.run{background:rgba(255,181,71,.13);color:var(--accent)}
.st.new{background:#212c47;color:var(--muted)}
.st.done{background:rgba(63,216,166,.13);color:var(--mint)}
.st.error{background:rgba(255,107,107,.13);color:var(--red)}
.task .sum{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.task .acts{grid-column:1/-1;display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:7px 12px;font-weight:800;font-size:12.5px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--mint);border-color:var(--mint);color:#062a1d}
.empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:13px}

/* jamoa */
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mate{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:7px;text-align:left}
.mate.sel{border-color:var(--accent)}
.mate .hd{display:flex;gap:8px;align-items:center}
.mate .hd div{min-width:0}
.mate b{display:block;font-size:13.5px}
.mate span{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mate .stt{font-size:11.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;min-height:16px}
.mate .stt i{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none}
.mate .stt.work{color:var(--accent)} .mate .stt.work i{background:var(--accent)}
.mate .ft{display:flex;justify-content:space-between;font:600 11px var(--f-mono);color:var(--muted)}
.mate .ft b{display:inline;font-size:11px;color:var(--text)}

/* natija oynasi */
.modal{position:fixed;inset:0;z-index:20;background:rgba(3,6,14,.6);display:flex;align-items:flex-end;justify-content:center}
.mbox{width:100%;max-width:640px;max-height:calc(var(--vh) - 40px);background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.mh{display:flex;gap:10px;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.mh>div:not(.av){min-width:0;flex:1}
.mh b{display:block;font:600 14px/1.3 var(--f-display)}
.mh span{font-size:12px;color:var(--muted)}
.x{width:34px;height:34px;border-radius:10px;background:var(--card);font-size:18px;color:var(--muted)}
.mb{overflow-y:auto;padding:14px 16px;font-size:14.5px;line-height:1.6;overflow-wrap:anywhere}
.mb p{margin:0 0 10px}
.mb .h{display:block;font-size:15px;margin-top:4px}
.mb pre{background:#070b16;border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;font:500 12.5px/1.5 var(--f-mono);margin:0 0 10px}
.mb .sumq{border-left:3px solid var(--mint);padding:2px 0 2px 10px;color:var(--muted);margin-bottom:12px}
.mf{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-wrap:wrap}
.mf .sp{flex:1}
.pub{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.pub label{font-size:12px;font-weight:700;color:var(--muted)}
.pub textarea{width:100%;resize:vertical;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px;font:500 15px/1.45 var(--f-body);max-height:40vh}
.pubd{font-size:12px;font-weight:800;color:var(--mint);align-self:center}
@media (prefers-reduced-motion:reduce){.mbox{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage" aria-label="3D ofis">
    <canvas id="c"></canvas>
    <div class="labels" id="labels"></div>
    <div class="top">
      <div class="pill brand"><span class="led" id="led"></span><div><b>Virtual Ofis</b><br><small id="aiName">ulanmoqda</small></div></div>
      <div class="pill" id="activeN"></div>
    </div>
    <div class="toast" id="toast" hidden></div>
  </section>

  <section class="sheet">
    <div class="grab"></div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="chat" aria-selected="true">Chat</button>
      <button class="tab" role="tab" data-tab="tasks" aria-selected="false">Vazifalar <span class="cnt" id="tcount" hidden>0</span></button>
      <button class="tab" role="tab" data-tab="team" aria-selected="false">Jamoa</button>
    </nav>

    <div class="view" id="v-chat">
      <div class="scroll" id="chatScroll">
        <div class="banner" id="demoBanner" hidden>Demo rejim: bu yerda AI ulanmagan, javoblar namunaviy. Botdagi «Ofis» tugmasi orqali ochsangiz, xodimlar haqiqiy AI bilan ishlaydi.</div>
        <div class="msgs" id="msgs"></div>
      </div>
      <div class="compose">
        <div class="mlist" id="mlist" hidden></div>
        <div class="quick">
          <button class="qc" data-send="Hisobot ber">Hisobot ber</button>
          <button class="qc" data-send="Kanal uchun yangi post tayyorla" id="qcPost" hidden>Kanal posti</button>
          <button class="qc" data-fill="YouTube video uchun 5 ta sarlavha va prevyu g‘oyasi kerak">Sarlavha + prevyu</button>
          <button class="qc" data-fill="Instagram uchun bir haftalik post rejasi tuz">Post rejasi</button>
          <button class="qc" data-fill="@Feruza Reels reklamasi narxini hisobla: 30 soniya, 3D animatsiya">Narx hisobla</button>
          <button class="qc" data-fill="@Elyor Telegram bot uchun /start buyrug‘iga javob beradigan kod yoz">Bot kodi</button>
        </div>
        <form class="row" id="f" autocomplete="off">
          <textarea id="inp" rows="1" placeholder="Vazifa yozing yoki @ism…" aria-label="Xabar"></textarea>
          <button class="send" id="sendBtn" type="submit" aria-label="Yuborish"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </form>
      </div>
    </div>

    <div class="view" id="v-tasks" hidden>
      <div class="scroll">
        <div class="seg" role="group" aria-label="Saralash">
          <button data-f="all" aria-pressed="true">Hammasi</button>
          <button data-f="run" aria-pressed="false">Jarayonda</button>
          <button data-f="done" aria-pressed="false">Tayyor</button>
        </div>
        <div class="tl" id="tlist"></div>
      </div>
    </div>

    <div class="view" id="v-team" hidden>
      <div class="scroll"><div class="team" id="team"></div>
        <div style="margin-top:14px;display:flex;justify-content:center"><button class="btn" id="resetBtn">Ofisni tozalash</button></div>
      </div>
    </div>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mh"><div class="av" id="mAv"></div><div><b id="mTitle"></b><span id="mWho"></span></div><button class="x" id="mClose" aria-label="Yopish">×</button></div>
    <div class="mb" id="mBody"></div>
    <div class="pub" id="pubBox" hidden>
      <label for="pubText">Kanalga shunday chiqadi (tahrirlash mumkin):</label>
      <textarea id="pubText" rows="8"></textarea>
    </div>
    <div class="mf">
      <button class="btn pri" id="mCopy">Nusxa olish</button>
      <button class="btn" id="mPub" hidden>📢 Kanalga</button>
      <span class="sp"></span>
      <button class="btn" id="mUp" aria-label="Yaxshi">👍 Zo‘r</button>
      <button class="btn" id="mDown" aria-label="Yomon">👎 Qayta</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
/* =========================================================
   Sozlamalar va Telegram
   ========================================================= */
const TG = window.Telegram && window.Telegram.WebApp;
const qs = new URLSearchParams(location.search);
const INIT = TG && TG.initData || "";
const API = qs.get("api") || (INIT && /^https?:/.test(location.protocol) ? location.origin : "");
const DEMO = qs.has("demo") || !INIT || !API;
if(TG){ try{ TG.ready(); TG.expand(); TG.setHeaderColor("#0b0f1a"); TG.setBackgroundColor("#0b0f1a"); if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }catch(e){} }
const haptic=(k,v)=>{try{ if(!TG||!TG.HapticFeedback) return; k==="n"?TG.HapticFeedback.notificationOccurred(v):TG.HapticFeedback.impactOccurred(v);}catch(e){}};

const TEAM = {
 rustam:{name:"Rustam",role:"Boshliq",col:"#7d8cb3",shirt:"#2c3550",hair:"#2a221e",skin:"#e0b48e",f:false},
 elyor:{name:"Elyor",role:"Backend dasturchi",col:"#3f8cff",hair:"#1b1817",skin:"#e8c09a",f:false},
 doniyor:{name:"Doniyor",role:"Frontend dasturchi",col:"#1fb8cd",hair:"#3a2a1e",skin:"#d9a77e",f:false},
 otabek:{name:"Otabek",role:"Dizayner",col:"#f06b2a",hair:"#141414",skin:"#e3b590",f:false},
 sanjar:{name:"Sanjar",role:"Marketolog",col:"#8061f0",hair:"#2a1f18",skin:"#dcae86",f:false},
 feruza:{name:"Feruza",role:"Moliyachi",col:"#ee5f97",hair:"#3b2416",skin:"#efc6a4",f:true},
 umida:{name:"Umida",role:"HR menejer",col:"#1fc796",hair:"#24160f",skin:"#e6bb96",f:true},

let D=null;
function demoInit(){
  D={v:2,nid:1,owner:"Mehmon",tasks:[],msgs:[],scores:Object.fromEntries(IDS.map(i=>[i,50]))};
  dm("rustam","Assalomu alaykum! Bu demo ofis. Vazifa yozing, masalan «YouTube video uchun sarlavha va prevyu kerak», va xodimlar qanday ishlashini ko‘ring.");
}
function dm(from,text,extra){const m={id:D.nid++,from,text,t:Date.now(),...(extra||{})};D.msgs.push(m);return m;}
const DKW={elyor:["kod","server","bot","api"],doniyor:["sayt","sahifa","ilova","html"],otabek:["dizayn","logo","banner","prevyu","rasm"],sanjar:["reklama","marketing","strategiya"],feruza:["narx","pul","xarajat","hisob"],umida:["xodim","vakansiya"],sabina:["instagram","post","reels","kanal"],dilnoza:["matn","ssenariy","sarlavha"],shoxrux:["test","tekshir"],laylo:["video","montaj","subtitr"],behruz:["mijoz","sotuv","taklif"]};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function demo(path,body){
  if(!D) demoInit();
  if(path==="/api/state"){ await wait(200); return {state:JSON.parse(JSON.stringify(D)),ai:"demo",channel:"@kanal (demo)"}; }
  if(path==="/api/publish"){ await wait(700); const t=D.tasks.find(x=>x.id===body.id); if(t){t.published=Date.now();t.result=body.text;} dm("sabina","«"+(t&&t.title)+"» kanalga joylandi ✅ (demo: aslida hech narsa yuborilmadi)",{taskIds:[body.id]}); return {state:JSON.parse(JSON.stringify(D))}; }
  if(path==="/api/send"){
    const text=body.text, low=norm(text); dm("me",text); await wait(rand(900,1600));
    const ment=(text.match(/@([A-Za-z]+)/)||[])[1], mid=ment&&byName[ment.toLowerCase()];
    if(/hisobot|nima gap/.test(low)){ const run=D.tasks.filter(t=>t.status!=="done"); dm("rustam",run.length?"Hozir "+run.length+" ta ish jarayonda: "+run.map(t=>TEAM[t.who].name+" — «"+t.title+"»").join(", ")+".":"Hozircha jarayonda ish yo‘q. Yangi vazifa bering!"); }
    else if(low.split(/\s+/).length>=3){
      let who=[]; if(mid&&mid!=="rustam") who=[mid]; else { for(const [id,ws] of Object.entries(DKW)) if(ws.some(w=>low.includes(w))) who.push(id); if(!who.length) who=["sardor"]; who=who.slice(0,3); }
      const ids=who.map(w=>{const t={id:D.nid++,who:w,title:text.replace(/@\S+/g,"").trim().slice(0,50),brief:text,status:"new",created:Date.now()};D.tasks.push(t);return t.id;});
      dm(mid&&mid!=="rustam"?mid:"rustam",(mid&&mid!=="rustam")?"Qabul qildim, boshladim!":"Qabul qildim. "+who.map(w=>TEAM[w].name).join(" va ")+"ga topshirdim.",{taskIds:ids});
    } else dm(mid||"rustam","Tushunarli! Vazifa bersangiz, kerakli odamga topshiraman.");
    return {state:JSON.parse(JSON.stringify(D))};
  }
  if(path==="/api/run"){
    const t=D.tasks.find(x=>x.id===body.id); if(!t||t.status!=="new") return {state:JSON.parse(JSON.stringify(D))};
    t.status="run"; t.started=Date.now(); await wait(rand(7000,12000));
    t.status="done"; t.done=Date.now(); t.summary="«"+t.title+"» bo‘yicha namunaviy natija tayyor.";
    t.result="Bu demo natija. Haqiqiy ofisda bu yerda "+TEAM[t.who].name+" ("+TEAM[t.who].role.toLowerCase()+") AI orqali tayyorlagan to‘liq ish turadi: matnlar, reja, kod yoki hisob-kitob.\n\n**Masalan:**\n1. Birinchi variant\n2. Ikkinchi variant\n3. Uchinchi variant";
    D.scores[t.who]+=3; dm(t.who,t.summary,{taskIds:[t.id],kind:"result"});
    return {state:JSON.parse(JSON.stringify(D))};
  }
  if(path==="/api/rate"){ const t=D.tasks.find(x=>x.id===body.id); if(t&&!t.rated){t.rated=body.v>0?2:-2;D.scores[t.who]+=t.rated;} return {state:JSON.parse(JSON.stringify(D))}; }
  if(path==="/api/retry"){ const t=D.tasks.find(x=>x.id===body.id); if(t) t.status="new"; return {state:JSON.parse(JSON.stringify(D))}; }
  if(path==="/api/reset"){ demoInit(); return {state:JSON.parse(JSON.stringify(D))}; }
}

const labels=$("labels");
const AV={}, hitMeshes=[];
class Agent{
  constructor(id,home){
    this.id=id; this.p=TEAM[id]; this.home=home; this.spot=home; this.q=[]; this.path=[]; this.walking=false; this.waitT=0; this.t=Math.random()*9;
    const p=this.p, shirt=M(p.shirt||p.col,{roughness:.75}), skin=M(p.skin,{roughness:.6}), hair=M(p.hair), pants=M("#262d42");
    this.g=new THREE.Group(); this.body=new THREE.Group(); this.g.add(this.body);
    const parts=[];
    this.legs=[-.13,.13].map(x=>{const pv=new THREE.Group();pv.position.set(x,.56,0);this.body.add(pv);parts.push(cyl(.11,.1,.52,pants,0,-.26,0,10,true,pv));parts.push(sph(.11,M("#1c2030"),0,-.52,.04,true,pv,10,8));return pv;});
    parts.push(cyl(.3,.34,.62,shirt,0,.9,0,18,true,this.body));
    const sh=sph(.3,shirt,0,1.2,0,true,this.body);sh.scale.y=.45;parts.push(sh);
    if(id==="rustam"){parts.push(box(.08,.4,.03,M("#d23b3b"),0,.98,.33,false,this.body));box(.22,.06,.04,MB("#ffffff"),0,1.2,.29,false,this.body);}
    else parts.push(box(.38,.05,.02,M(p.col),0,1.02,.335,false,this.body)); // ish kartasi tasmasi rangi
    this.arms=[-.37,.37].map(x=>{const pv=new THREE.Group();pv.position.set(x,1.17,0);this.body.add(pv);parts.push(cyl(.075,.07,.55,shirt,0,-.27,0,8,true,pv));parts.push(sph(.08,skin,0,-.57,0,true,pv,10,8));return pv;});
    parts.push(cyl(.09,.09,.12,skin,0,1.33,0,8,false,this.body));
    this.head=sph(.3,skin,0,1.62,0,true,this.body,20,14); parts.push(this.head);
    const hc=new THREE.Mesh(new THREE.SphereGeometry(.32,20,10,0,Math.PI*2,0,Math.PI*.55),hair);hc.position.set(0,1.64,-.02);hc.castShadow=true;this.body.add(hc);parts.push(hc);
    if(p.f){parts.push(rbox(.5,.62,.16,.06,hair,0,1.48,-.22,true,this.body));}
    const eye=MB("#141414"); sph(.035,eye,-.1,1.65,.275,false,this.body,8,6); sph(.035,eye,.1,1.65,.275,false,this.body,8,6);
    parts.forEach(m=>{m.userData.agent=this;hitMeshes.push(m);});
    this.g.position.copy(home.pos); this.g.rotation.y=home.face; scene.add(this.g); this.pose(home.sit);
    this.tag=document.createElement("div");this.tag.className="tag";labels.appendChild(this.tag);this.tagKey="";
    this.bub=document.createElement("div");this.bub.className="bub";this.bub.hidden=true;labels.appendChild(this.bub);this.bubT=0;
  }
  pose(sit){ this.sitting=sit; this.body.position.y=sit?-.02:0; this.legs.forEach(l=>l.rotation.x=sit?-1.45:0); }
  say(text,ms=3200,dots=false){ this.bub.textContent=text.length>80?text.slice(0,78)+"…":text; this.bub.classList.toggle("dots",dots); this.bub.hidden=false; this.bubT=dots?999:ms/1000; }
  hush(){ this.bub.hidden=true; this.bubT=0; }
  act(list){ this.q.push(...list); }
  get busy(){ return this.walking||this.waitT>0||this.q.length>0; }
  goto(s){
    if(this.spot&&this.spot.occ===this) this.spot.occ=null;
    if(s.name.startsWith("cafe")||s.name.startsWith("hand")||s.name==="coffee") s.occ=this;
    this.path=route(this.spot||this.home,s); this.target=s; this.spot=null; this.walking=true; this.pose(false);
    if(!this.path.length) this.arrive();
  }
  arrive(){ this.walking=false; const s=this.target; this.spot=s; this.g.position.copy(s.pos); this.g.rotation.y=s.face; this.pose(s.sit); }
  update(dt){
    this.t+=dt;
    if(this.walking){
      const tg=this.path[0];
      if(!tg) this.arrive();
      else{ const p=this.g.position,dx=tg.x-p.x,dz=tg.z-p.z,d=Math.hypot(dx,dz),st=3.1*dt;
        if(d<=st){p.x=tg.x;p.z=tg.z;this.path.shift();} else {p.x+=dx/d*st;p.z+=dz/d*st;}
        if(d>.01){let a=Math.atan2(dx,dz)-this.g.rotation.y;a=Math.atan2(Math.sin(a),Math.cos(a));this.g.rotation.y+=a*Math.min(1,dt*12);}
        const w=Math.sin(this.t*10); this.legs[0].rotation.x=w*.55; this.legs[1].rotation.x=-w*.55; this.arms[0].rotation.x=-w*.5; this.arms[1].rotation.x=w*.5; this.body.position.y=Math.abs(Math.cos(this.t*10))*.05; }
    } else if(this.waitT>0){ this.waitT-=dt; }
    else if(this.q.length){ const a=this.q.shift(); if(a.go) this.goto(typeof a.go==="function"?a.go():a.go); else if(a.wait) this.waitT=a.wait; else if(a.fn) a.fn(this); }
    else if(this.spot!==this.home){ this.goto(this.home); }
    // pozalar
    if(!this.walking){
      if(this.working){ const k=Math.sin(this.t*16)*.08; this.arms[0].rotation.x=-1.15+k; this.arms[1].rotation.x=-1.15-k; this.head.position.y=1.62+Math.sin(this.t*3)*.01; }
      else { this.arms[0].rotation.x=this.arms[1].rotation.x=this.sitting?-.35:Math.sin(this.t*1.5)*.04; this.body.position.y=this.sitting?-.02:Math.sin(this.t*2)*.01; }
    }
    if(this.bubT>0&&this.bubT<999){this.bubT-=dt;if(this.bubT<=0)this.bub.hidden=true;}
  }
}

/* =========================================================
   Ofis holati va xoreografiya
   ========================================================= */
let S=null, lastMsg=0, aiMode="", CHANNEL="";
const localRun=new Map();   // taskId -> boshlangan vaqt (shu ilovada)
const runQueue=[]; let running=0;
let thinking=false;

function taskById(id){ return S&&S.tasks.find(t=>t.id===id); }
function isActive(t){ return t.status==="new"||t.status==="run"||localRun.has(t.id); }
function progress(t){
  if(t.status==="done") return 100;
  if(t.status==="error") return 0;
  const st=localRun.get(t.id)||(t.status==="run"?t.started:0);
  if(!st) return 0;
  return Math.min(95,Math.floor(100*(1-Math.exp(-(Date.now()-st)/14000))));
}
function freeSpot(names){ return names.map(n=>SP[n]).find(s=>!s.occ)||SP[names[0]]; }

function assignFlow(tasks){
  const R=AV.rustam;
  R.hush();
  tasks.forEach(t=>{
    const who=AV[t.who];
    R.act([{go:()=>DESK[t.who].visit},{fn:()=>{R.say("«"+t.title+"»"); setTimeout(()=>who.say("Qabul qildim!",2200),700);}},{wait:1.6}]);
  });
  R.act([{go:SP.boss}]);
}
function reviewFlow(t){
  const src=taskById(t.review), sh=AV.shoxrux;
  if(src) sh.act([{go:()=>DESK[src.who].visit},{fn:()=>{sh.say("Ko‘rib chiqaman");AV[src.who].say("Mana, tayyor!",2000);}},{wait:1.8}]);
}
function doneFlow(t){
  const a=AV[t.who], R=AV.rustam;
  a.act([
    {go:()=>freeSpot(["hand-a","hand-b"])},
    {fn:()=>{a.say("Tayyor: «"+t.title+"»",2600); setTimeout(()=>R.say(pick(["Barakalla, ","Zo‘r ish, ","Rahmat, "])+a.p.name+"!",2400),900);}},
    {wait:2.2}
  ]);
  const more=S.tasks.some(x=>x.who===t.who&&x.id!==t.id&&isActive(x));
  if(!more&&Math.random()<.5){ a.act([{go:()=>freeSpot(["coffee","cafe-16.7","cafe-15.3","cafe-10.7","cafe-9.3"])},{fn:()=>a.say(pick(["Bir piyola choy…","Kofe vaqti!","Ozgina nafas olay"]),2200)},{wait:rand(9,15)}]); }
}
function errorFlow(t){ AV[t.who].say("Xatolik bo‘ldi, qayta urinaman?",3500); }

function enqueueRun(t){ if(runQueue.includes(t.id)||localRun.has(t.id)) return; runQueue.push(t.id); pump(); }
function pump(){
  while(running<2&&runQueue.length){
    const id=runQueue.shift(); const t=taskById(id); if(!t||t.status==="done") continue;
    running++; localRun.set(id,Date.now());
    call("/api/run",{id}).then(r=>applyState(r.state)).catch(e=>toast(e.message)).finally(()=>{running--;localRun.delete(id);pump();});
  }
}

/* =========================================================
   Holatni qo'llash (server javobi)
   ========================================================= */
function applyState(ns,initial){
  const prev=new Map(S?S.tasks.map(t=>[t.id,t.status]):[]);
  S=ns;
  // xabarlar
  document.querySelectorAll(".m.wait").forEach(e=>e.remove());
  const fresh=ns.msgs.filter(m=>m.id>lastMsg);
  if(initial){ $("msgs").innerHTML=""; }
  fresh.forEach(m=>{ $("msgs").appendChild(renderMsg(m)); if(!initial&&m.from!=="me"&&AV[m.from]&&m.kind!=="result"&&!(m.from==="rustam"&&m.taskIds)) AV[m.from].say(m.text.split("\n")[0],3800); });
  if(fresh.length){ lastMsg=Math.max(...fresh.map(m=>m.id)); scrollChat(true); }
  // vazifalar
  if(!initial){
    const neu=ns.tasks.filter(t=>!prev.has(t.id));
    const normal=neu.filter(t=>!t.review); if(normal.length) assignFlow(normal);
    neu.filter(t=>t.review).forEach(reviewFlow);
    ns.tasks.forEach(t=>{const p=prev.get(t.id); if(p&&p!=="done"&&t.status==="done"){doneFlow(t);haptic("n","success");} if(p&&p!=="error"&&t.status==="error") errorFlow(t);});
  }
  ns.tasks.forEach(t=>{ if(t.status==="new"||(t.status==="run"&&Date.now()-(t.started||0)>150000)) enqueueRun(t); });
  renderTasks(); renderTeam(); drawBoard(); tick();
}

function avHTML(id,cls){ const p=TEAM[id]; return '<div class="av '+(cls||"")+'" style="background:'+p.col+'">'+p.name[0]+'</div>'; }
function textHTML(t){ return String(t).split(/\n{2,}/).map(p=>"<p>"+esc(p).replace(/\n/g,"<br>").replace(/@([A-Za-z‘’ʻ']+)/g,(m,n)=>byName[n.toLowerCase()]?'<span class="mention">'+m+"</span>":m)+"</p>").join(""); }
function chipHTML(t){
  if(!t) return "";
  const done=t.status==="done", err=t.status==="error";
  return '<button class="tchip" data-open="'+t.id+'">'+avHTML(t.who)+'<div class="tt">'+esc(t.title)+'<small>'+TEAM[t.who].name+' · <span data-ts="'+t.id+'">'+stText(t)+'</span></small></div><span class="pc'+(done?" ok":err?" err":"")+'" data-tl="'+t.id+'">'+(err?"!":progress(t)+"%")+'</span><div class="bar'+(done?" ok":"")+'"><i data-tp="'+t.id+'" style="width:'+progress(t)+'%"></i></div></button>';
}
function stText(t){ if(t.status==="done") return "tayyor"; if(t.status==="error") return "xato"; const a=AV[t.who]; if(localRun.has(t.id)||t.status==="run") return a&&a.working?"ishlayapti":"boshlayapti"; return "navbatda"; }
function renderMsg(m){
  const d=document.createElement("div");
  if(m.from==="me"){ d.className="m me"; d.innerHTML='<div class="txt">'+textHTML(m.text)+'</div>'; return d; }
  const p=TEAM[m.from]||TEAM.rustam; d.className="m";
  let extra="";
  if(m.kind==="result"&&m.taskIds){ const t=taskById(m.taskIds[0]);
    extra = t ? '<div class="res"><div class="rt">Natija tayyor</div><div class="rh">'+esc(t.title)+'</div><div class="rp">'+esc((t.result||"").replace(/\*\*|```[\w+-]*|^#{1,4}\s*/gm,"").slice(0,260))+'</div><button class="open" data-open="'+t.id+'">Natijani ochish</button></div>' : "";
  } else if(m.taskIds){ extra='<div class="chips">'+m.taskIds.map(id=>chipHTML(taskById(id))).join("")+'</div>'; }
  d.innerHTML=avHTML(m.from)+'<div class="b"><div class="meta"><b>'+p.name+'</b><span>'+p.role+'</span><span class="t">'+hhmm(m.t)+'</span></div>'+(m.kind==="result"?"":'<div class="txt">'+textHTML(m.text)+'</div>')+extra+'</div>';
  if(m.kind==="result"){ const txt=document.createElement("div"); txt.className="txt"; txt.innerHTML=textHTML(m.text); d.querySelector(".b").insertBefore(txt,d.querySelector(".res")); }
  return d;
}

  if(!on&&el) el.remove();
}
async function send(text){
  text=text.trim(); if(!text||thinking) return;
  haptic("i","light");
  const d=document.createElement("div"); d.className="m me wait"; d.innerHTML='<div class="txt">'+textHTML(text)+'</div>'; $("msgs").appendChild(d); scrollChat(true);
  thinking=true; $("sendBtn").disabled=true; showTyping(true);
  const R=AV.rustam; R.say("O‘ylayapman",0,true);
  try{ const r=await call("/api/send",{text}); R.hush(); showTyping(false); applyState(r.state); }
  catch(e){ R.hush(); showTyping(false); d.classList.remove("wait"); toast(e.message); }
  finally{ thinking=false; $("sendBtn").disabled=false; }
}

/* =========================================================
   Vazifalar va jamoa
   ========================================================= */
let filt="all";
function renderTasks(){
  if(!S) return;
  let list=S.tasks.slice().sort((a,b)=>(isActive(b)-isActive(a))||b.id-a.id);
  if(filt==="run") list=list.filter(t=>t.status!=="done"); if(filt==="done") list=list.filter(t=>t.status==="done");
  const n=S.tasks.filter(t=>t.status!=="done"&&t.status!=="error").length; $("tcount").textContent=n; $("tcount").hidden=!n;
  $("tlist").innerHTML=list.length?list.map(t=>{const cls=t.status==="done"?"done":t.status==="error"?"error":(localRun.has(t.id)||t.status==="run")?"run":"new";
    const lab={done:"Tayyor",error:"Xato",run:"Jarayonda",new:"Navbatda"}[cls];
    return '<div class="task">'+avHTML(t.who)+'<div class="tt">'+esc(t.title)+'<small>'+TEAM[t.who].name+' · '+TEAM[t.who].role+'</small></div><span class="st '+cls+'">'+lab+'</span>'
      +(cls==="done"?'<div class="sum">'+esc(t.summary||"")+'</div><div class="acts"><button class="btn ok" data-open="'+t.id+'">Natijani ochish</button>'+(t.published?'<span class="pubd">📢 kanalda</span>':"")+(t.rated?'<span class="st '+(t.rated>0?"done":"error")+'" style="align-self:center">'+(t.rated>0?"👍 baholandi":"👎 baholandi")+'</span>':"")+'</div>'
       :cls==="error"?'<div class="sum">'+esc(t.error||"")+'</div><div class="acts"><button class="btn pri" data-retry="'+t.id+'">Qayta urinish</button></div>'
       :'<div class="bar" style="grid-column:1/-1"><i data-tp="'+t.id+'" style="width:'+progress(t)+'%"></i></div>')+'</div>';}).join("")
    :'<div class="empty">Hali vazifa yo‘q. Chatga ish yozing, Rustam taqsimlaydi.</div>';
}
function agentState(a){
  if(a.id==="rustam"&&thinking) return ["think","O‘ylayapti"];
  if(a.working){ const t=S&&S.tasks.find(x=>x.who===a.id&&isActive(x)); return ["work",t?progress(t)+"% · «"+t.title+"»":"Ishlayapti"]; }
  if(a.walking) return ["walk","Yo‘lda"];
  if(S&&S.tasks.some(x=>x.who===a.id&&x.status==="error")) return ["err","Xato, qayta urinish kerak"];
  if(a.spot&&a.spot.name.startsWith("cafe")||a.spot&&a.spot.name==="coffee") return ["idle","Tanaffusda"];
  return ["idle",a.id==="rustam"?"Kabinetida":"Bo‘sh"];
}
function renderTeam(){
  if(!S) return;
  const done={}; S.tasks.forEach(t=>{if(t.status==="done")done[t.who]=(done[t.who]||0)+1;});
  $("team").innerHTML=IDS.map(id=>{const a=AV[id],[k,txt]=agentState(a);
    return '<button class="mate'+(sel===a?" sel":"")+'" data-agent="'+id+'"><div class="hd">'+avHTML(id)+'<div><b>'+TEAM[id].name+'</b><span>'+TEAM[id].role+'</span></div></div><div class="stt '+k+'" data-st="'+id+'"><i></i><span>'+esc(txt)+'</span></div><div class="ft"><span><b>'+(S.scores[id]||50)+'</b> ball</span><span><b>'+(done[id]||0)+'</b> ish</span></div></button>';}).join("");
}
function drawBoard(){
  const g=boardC.getContext("2d"),W=512,H=300; g.fillStyle="#0d1530";g.fillRect(0,0,W,H);
  const done=S?S.tasks.filter(t=>t.status==="done").length:0, run=S?S.tasks.filter(isActive).length:0;
  const top=S?STAFF.slice().sort((a,b)=>(S.scores[b]||0)-(S.scores[a]||0))[0]:"rustam";
  g.fillStyle="#ffb547";g.font="600 22px Unbounded, sans-serif";g.fillText("OFIS PANELI",28,46);
  g.fillStyle="#8994b0";g.font="600 20px Manrope, sans-serif";g.fillText("Tayyor",28,104);g.fillText("Jarayonda",200,104);
  g.fillStyle="#3fd8a6";g.font="700 64px JetBrains Mono, monospace";g.fillText(String(done),28,172);
  g.fillStyle="#ffb547";g.fillText(String(run),200,172);
  g.fillStyle="#8994b0";g.font="600 20px Manrope, sans-serif";g.fillText("Eng faol: "+TEAM[top].name+" · "+(S?S.scores[top]:0)+" ball",28,236);
  g.fillStyle="#1c2742";g.fillRect(28,256,456,10);g.fillStyle="#3fd8a6";g.fillRect(28,256,456*(done/Math.max(1,done+run)),10);
  boardT.needsUpdate=true;
}

/* =========================================================
   Natija oynasi
   ========================================================= */
function md(src){
  return String(src||"").split("```").map((p,i)=>{
    if(i%2) return "<pre><code>"+esc(p.replace(/^[\w+-]*\n/,""))+"</code></pre>";
    return esc(p).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#{1,4}\s*(.+)$/gm,'<b class="h">$1</b>').split(/\n{2,}/).filter(b=>b.trim()).map(b=>"<p>"+b.trim().replace(/\n/g,"<br>")+"</p>").join("");
  }).join("");
}
let openId=null;
function openResult(id){
  const t=taskById(id); if(!t) return;
  if(t.status!=="done"){ const a=AV[t.who]; select(a); toast(t.status==="error"?"Xato: "+(t.error||""):TEAM[t.who].name+" ishlayapti: "+progress(t)+"%"); return; }
  openId=id; const p=TEAM[t.who];
  $("mAv").textContent=p.name[0]; $("mAv").style.background=p.col;
  $("mTitle").textContent=t.title; $("mWho").textContent=p.name+" · "+p.role+(t.done?" · "+hhmm(t.done):"");
  $("mBody").innerHTML='<div class="sumq">'+esc(t.summary||"")+"</div>"+md(t.result);
  $("mUp").disabled=$("mDown").disabled=!!t.rated;
  $("pubBox").hidden=true; $("mBody").hidden=false;
  $("mPub").hidden=!CHANNEL; $("mPub").textContent=t.published?"✓ Kanalda":"📢 Kanalga"; $("mPub").disabled=!!t.published;
  $("modal").hidden=false; $("mBody").scrollTop=0;
  if(TG&&TG.BackButton){ TG.BackButton.show(); }
}
function closeModal(){ $("modal").hidden=true; openId=null; if(TG&&TG.BackButton) TG.BackButton.hide(); }
$("mClose").onclick=closeModal; $("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
if(TG&&TG.BackButton) TG.BackButton.onClick(closeModal);
$("mCopy").onclick=async()=>{const t=taskById(openId);if(!t)return;const txt=t.title+"\n\n"+(t.summary||"")+"\n\n"+(t.result||"");
  try{await navigator.clipboard.writeText(txt);toast("Nusxa olindi");}catch(e){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Nusxa olindi");}catch(_){toast("Nusxa olib bo‘lmadi");}ta.remove();}};
async function rate(v){ const t=taskById(openId); if(!t||t.rated) return; $("mUp").disabled=$("mDown").disabled=true;
  try{ const r=await call("/api/rate",{id:t.id,v}); applyState(r.state); toast(v>0?TEAM[t.who].name+"ga +2 ball":"−2 ball. Qayta ishlashga yuborildi");
    if(v<0){ closeModal(); send("@"+TEAM[t.who].name+" «"+t.title+"» natijasi yoqmadi, qaytadan yaxshiroq qil."); } }catch(e){toast(e.message);} }
$("mPub").onclick=async()=>{ const t=taskById(openId); if(!t) return;
  if($("pubBox").hidden){ $("pubText").value=(t.result||"").replace(/\*\*(.+?)\*\*/g,"$1").replace(/^#{1,4}\s*/gm,""); $("pubBox").hidden=false; $("mBody").hidden=true; $("mPub").textContent="Joylash: "+CHANNEL; $("pubText").focus(); return; }
  $("mPub").disabled=true; $("mPub").textContent="Joylanmoqda…";
  try{ const r=await call("/api/publish",{id:t.id,text:$("pubText").value}); applyState(r.state); haptic("n","success"); toast("Kanalga joylandi"); closeModal(); }
  catch(e){ toast(e.message); $("mPub").disabled=false; $("mPub").textContent="Joylash: "+CHANNEL; } };
$("mUp").onclick=()=>rate(1); $("mDown").onclick=()=>rate(-1);

/* =========================================================
   UI hodisalari
   ========================================================= */
let toastT=null;
function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; el.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(()=>{el.style.opacity=0;setTimeout(()=>el.hidden=true,300);},2600); }
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function setTab(t){ document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===t))); ["chat","tasks","team"].forEach(k=>$("v-"+k).hidden=k!==t); if(t==="chat") scrollChat(true); }
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{filt=b.dataset.f;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));renderTasks();});
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o){ openResult(+o.dataset.open); return; }
  const r=e.target.closest("[data-retry]"); if(r){ call("/api/retry",{id:+r.dataset.retry}).then(x=>applyState(x.state)).catch(er=>toast(er.message)); return; }
  const ag=e.target.closest("[data-agent]"); if(ag){ select(AV[ag.dataset.agent]); if(ag.dataset.agent!=="rustam"){ $("inp").value="@"+TEAM[ag.dataset.agent].name+" "; } setTab("chat"); $("inp").focus(); return; }
});
document.querySelectorAll(".qc").forEach(c=>c.onclick=()=>{ if(c.dataset.send) send(c.dataset.send); else { $("inp").value=c.dataset.fill; grow(); $("inp").focus(); } });
const inp=$("inp"), ml=$("mlist"); let mlI=0, mlItems=[];
function grow(){ inp.style.height="auto"; inp.style.height=Math.min(110,inp.scrollHeight)+"px"; }
function mq(){ const m=inp.value.slice(0,inp.selectionStart).match(/@([A-Za-z‘’ʻ']*)$/); return m?m[1]:null; }
function showML(){ const q=mq(); if(q===null){ml.hidden=true;return;} mlItems=IDS.filter(i=>TEAM[i].name.toLowerCase().startsWith(q.toLowerCase())); if(!mlItems.length){ml.hidden=true;return;} mlI=Math.min(mlI,mlItems.length-1);
  ml.innerHTML=mlItems.map((i,k)=>'<button type="button" data-n="'+TEAM[i].name+'" class="'+(k===mlI?"on":"")+'">'+avHTML(i)+'<span><b>'+TEAM[i].name+'</b><br><small>'+TEAM[i].role+'</small></span></button>').join(""); ml.hidden=false; }
function insertM(n){ const pos=inp.selectionStart,v=inp.value,b=v.slice(0,pos).replace(/@([A-Za-z‘’ʻ']*)$/,"@"+n+" "); inp.value=b+v.slice(pos); inp.focus(); inp.setSelectionRange(b.length,b.length); ml.hidden=true; }
inp.addEventListener("input",()=>{grow();mlI=0;showML();});
inp.addEventListener("keydown",e=>{
  if(!ml.hidden){ if(e.key==="ArrowDown"){e.preventDefault();mlI=(mlI+1)%mlItems.length;showML();return;} if(e.key==="ArrowUp"){e.preventDefault();mlI=(mlI-1+mlItems.length)%mlItems.length;showML();return;} if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();insertM(TEAM[mlItems[mlI]].name);return;} if(e.key==="Escape"){ml.hidden=true;return;} }
  if(e.key==="Enter"&&!e.shiftKey&&window.matchMedia("(pointer:fine)").matches){ e.preventDefault(); $("f").requestSubmit(); }
});
ml.addEventListener("mousedown",e=>e.preventDefault());
ml.addEventListener("click",e=>{const b=e.target.closest("[data-n]");b&&insertM(b.dataset.n);});
$("f").addEventListener("submit",e=>{e.preventDefault();const v=inp.value;inp.value="";grow();ml.hidden=true;send(v);});
let armed=false;
$("resetBtn").onclick=async()=>{ const b=$("resetBtn"); if(!armed){armed=true;b.textContent="Rostdanmi? Yana bosing";b.style.borderColor="var(--red)";setTimeout(()=>{armed=false;b.textContent="Ofisni tozalash";b.style.borderColor="";},3000);return;}
  armed=false; b.textContent="Ofisni tozalash"; b.style.borderColor="";
  try{ const r=await call("/api/reset",{}); lastMsg=0; S=null; applyState(r.state,true); toast("Ofis tozalandi"); }catch(e){toast(e.message);} };

// tanlash
let sel=null, focus=null;
function select(a){ if(sel) sel.tag.classList.remove("sel"); sel=a; ring.visible=!!a; if(a){a.tag.classList.add("sel");focus=a.g.position;} renderTeam(); }
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2(); let down=null;
canvas.addEventListener("pointerdown",e=>{down=[e.clientX,e.clientY];});
canvas.addEventListener("pointerup",e=>{ if(!down)return; const mv=Math.hypot(e.clientX-down[0],e.clientY-down[1]); down=null; if(mv>6)return;
  const r=canvas.getBoundingClientRect(); ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(ptr,camera);
  const h=ray.intersectObjects(hitMeshes,false)[0]; const a=h&&h.object.userData.agent; select(a||null);
  if(a){ const [,txt]=agentState(a); toast(a.p.name+" · "+txt); } });

/* =========================================================
   O'lcham va sikl
   ========================================================= */
let W=1,H=1,zoomSet=false;
function resize(){ W=stage.clientWidth;H=stage.clientHeight;if(!W||!H)return; renderer.setSize(W,H,false); const a=W/H;
  camera.left=-FRUST*a/2;camera.right=FRUST*a/2;camera.top=FRUST/2;camera.bottom=-FRUST/2;
  if(!zoomSet){camera.zoom=Math.min(1.1,Math.max(.62,a/1.02*.74));zoomSet=true;} camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

let checkT=20;
function tick(){
  // ish holatini hisoblash
  for(const id of IDS){ const a=AV[id]; const has=S&&S.tasks.some(t=>t.who===id&&(localRun.has(t.id)||t.status==="run"));
    a.working=!!has&&!a.busy&&a.spot===a.home; const d=DESK[id]; if(d){ d.scr.material=a.working?scrWork:scrIdle; } }
  bossScr.material=thinking?scrWork:scrIdle;
  if(!S) return;
  const run=S.tasks.filter(isActive).length;
  $("activeN").innerHTML=run?"<b>"+run+"</b>&nbsp;ish jarayonda":"Hamma bo‘sh";
  for(const t of S.tasks){ const p=progress(t);
    document.querySelectorAll('[data-tp="'+t.id+'"]').forEach(el=>{el.style.width=p+"%"; if(t.status==="done") el.parentNode.classList.add("ok");});
    document.querySelectorAll('[data-tl="'+t.id+'"]').forEach(el=>{el.textContent=t.status==="error"?"!":p+"%"; el.classList.toggle("ok",t.status==="done");});
    document.querySelectorAll('[data-ts="'+t.id+'"]').forEach(el=>el.textContent=stText(t)); }
  IDS.forEach(id=>{const el=document.querySelector('[data-st="'+id+'"]'); if(el){const [k,txt]=agentState(AV[id]); el.className="stt "+k; el.lastChild.textContent=txt;}});
}
setInterval(tick,500);

const v3=new THREE.Vector3(); let last=performance.now();
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  for(const id of IDS) AV[id].update(dt);
  // Rustam ish ketayotganini tekshirib turadi (sababli yurish)
  checkT-=dt;
  if(checkT<=0){ checkT=rand(22,34); const R=AV.rustam; const w=STAFF.filter(id=>AV[id].working);
    if(w.length&&!R.busy&&!thinking&&R.spot===SP.boss){ const id=pick(w), t=S.tasks.find(x=>x.who===id&&isActive(x));
      R.act([{go:()=>DESK[id].visit},{fn:()=>{R.say(pick(["Qalay ketyapti?","Yordam kerakmi?","Dedlayn esingdami?"]));setTimeout(()=>AV[id].say(t?progress(t)+"% bo‘ldi, ozgina qoldi":"Ishlayapman!",2400),900);}},{wait:2.4}]); } }
  codeTex.offset.y=(codeTex.offset.y+dt*.12)%1;
  for(const id of STAFF){ const pl=DESK[id].pl.material; pl.opacity+=((AV[id].working?.55:0)-pl.opacity)*Math.min(1,dt*3); }
  globe.rotation.y+=dt*(reduce?.05:.35); wire.rotation.y-=dt*(reduce?.03:.2);
  if(!reduce) SPACE.tick(dt,now);
  if(focus){ controls.target.lerp(focus,Math.min(1,dt*4)); if(controls.target.distanceTo(focus)<.12) focus=null; }
  if(sel) ring.position.set(sel.g.position.x,.09,sel.g.position.z);
  controls.update(); renderer.render(scene,camera);
  // yorliqlar: faqat faol yoki tanlangan xodimlar
  for(const id of IDS){ const a=AV[id];
    v3.copy(a.g.position); v3.y+=(a.sitting?2.05:2.3); v3.project(camera);
    const x=(v3.x+1)/2*W, y=(1-v3.y)/2*H, inView=x>-60&&x<W+60&&y>-30&&y<H+30;
    const [k]=agentState(a); const show=inView&&(k!=="idle"||sel===a||id==="rustam");
    a.tag.style.display=show?"":"none";
    if(show){ a.tag.style.transform="translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px) translate(-50%,-100%)";
      const t=k==="work"&&S&&S.tasks.find(q=>q.who===id&&isActive(q)); const key=k+"|"+(t?progress(t):"")+"|"+(sel===a);
      if(key!==a.tagKey){ a.tagKey=key; a.tag.className="tag "+k+(sel===a?" sel":""); a.tag.innerHTML="<i></i>"+a.p.name+(t?"<em>"+progress(t)+"%</em>":""); } }
    if(!a.bub.hidden){ a.bub.style.display=inView?"":"none"; a.bub.style.transform="translate("+x.toFixed(1)+"px,"+(y-26).toFixed(1)+"px) translate(-18%,-100%)"; }
  }
}

/* =========================================================
   Ishga tushirish
   ========================================================= */
async function boot(){
  $("led").className="led"+(DEMO?" demo":"");
  if(DEMO) $("demoBanner").hidden=false;
  try{
    const r=await call("/api/state");
    aiMode=r.ai; CHANNEL=r.channel||""; $("qcPost").hidden=!CHANNEL; $("aiName").textContent={gemini:"Gemini AI",cloudflare:"Cloudflare AI",demo:"demo rejim",none:"AI ulanmagan"}[r.ai]||r.ai;
    if(r.ai==="none") $("led").className="led off";
    applyState(r.state,true);
    // server o'zi (Cron/bot) bajargan ishlarni ham ko'rib turamiz
    if(!DEMO) setInterval(async()=>{ if(thinking||document.hidden) return; try{ const r2=await call("/api/state"); applyState(r2.state);}catch(e){} },15000);
  }catch(e){
    $("aiName").textContent="ulanmadi"; $("led").className="led off";
    $("msgs").innerHTML='<div class="empty">'+esc(e.message)+'<br><br>Ofisni botdagi «Ofis» tugmasi orqali oching.</div>';
  }
  requestAnimationFrame(loop);
}
boot();
})();
