<!doctype html><html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Yuklab olish — Bu qanday ishlaydi?</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#050d24;color:#e8efff;font-family:system-ui,-apple-system,sans-serif;padding:24px max(16px,env(safe-area-inset-left)) 40px}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{margin:0;font-size:1.5rem}
p{margin:0;color:#9fb2dc;line-height:1.5}
figure{margin:0;display:flex;flex-direction:column;gap:10px}
img{width:100%;border-radius:10px;border:1px solid #1d3266}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.row span{font-weight:700;color:#cfe0ff}
button{background:#1d6bff;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:1rem;font-weight:700}
</style></head><body><main>
<h1>YouTube rasmlari</h1>
<p>«Yuklab olish» tugmasini bosing. Ishlamasa — rasm ustiga barmoqni bosib turing → «Rasmlarga saqlash».</p>
<figure><img src="youtube-banner-1024x576.jpg" alt="Banner 1024×576"><div class="row"><span>Banner — 1024×576</span><button data-f="youtube-banner-1024x576.jpg">⬇ Yuklab olish</button></div></figure>
<figure><img src="youtube-banner-2560x1440.jpg" alt="Banner 2560×1440"><div class="row"><span>Banner — 2560×1440</span><button data-f="youtube-banner-2560x1440.jpg">⬇ Yuklab olish</button></div></figure>
<figure><img src="youtube-avatar-800.jpg" alt="Profil rasmi" style="max-width:320px"><div class="row"><span>Profil rasmi — 800×800</span><button data-f="youtube-avatar-800.jpg">⬇ Yuklab olish</button></div></figure>
</main><script>
const W=window.Telegram&&Telegram.WebApp;try{W&&W.ready();W&&W.expand()}catch(e){}
document.querySelectorAll('button[data-f]').forEach(b=>b.onclick=()=>{
  const url=new URL(b.dataset.f,location.href).href;
  try{ if(W&&W.downloadFile&&W.isVersionAtLeast&&W.isVersionAtLeast('8.0')){W.downloadFile({url,file_name:b.dataset.f});return} }catch(e){}
  try{ if(W&&W.openLink&&W.initData){W.openLink(url);return} }catch(e){}
  window.open(url,'_blank');
});
</script></body></html>
